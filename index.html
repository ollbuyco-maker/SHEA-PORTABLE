<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>EA Dashboard PRO</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #0f172a, #020617);
    color: white;
}

/* LOADING */
#loading {
    position: fixed;
    width: 100%;
    height: 100vh;
    z-index: 9999;
}
#loading img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    animation: zoom 5s infinite;
}
@keyframes zoom {
    0% {transform: scale(1);}
    50% {transform: scale(1.15);}
    100% {transform: scale(1);}
}

/* DASHBOARD */
#content {
    display: none;
    padding: 20px;
    text-align: center;
}

/* GLASS CARD */
.card {
    margin: auto;
    max-width: 380px;
    padding: 30px;
    border-radius: 20px;
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.05);
    box-shadow: 0 0 30px rgba(0,0,0,0.8);
}

/* LOGO */
.logo {
    width: 80px;
    margin-bottom: 10px;
}

/* STATUS */
.status {
    margin: 15px 0;
    font-size: 18px;
}

/* BUTTON BULAT */
.btn {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: none;
    margin: 10px;
    font-size: 18px;
    cursor: pointer;
    transition: 0.3s;
}

/* ON */
.on {
    background: #00ff88;
    box-shadow: 0 0 25px #00ff88;
}

/* OFF */
.off {
    background: #ff0033;
    box-shadow: 0 0 25px #ff0033;
}

.btn:hover {
    transform: scale(1.1);
}

/* HOME */
.home {
    margin-top: 20px;
    padding: 12px 25px;
    border-radius: 10px;
    background: #3b82f6;
    border: none;
    color: white;
}

/* FOOTER */
.footer {
    margin-top: 15px;
    opacity: 0.7;
}
</style>
</head>

<body>

<!-- SOUND -->
<audio id="soundOn" src="on.mp3"></audio>
<audio id="soundOff" src="off.mp3"></audio>

<!-- LOADING -->
<div id="loading">
    <img src="Tak berjudul63_20260504071527.png">
</div>

<div class="navbar">

<!-- DASHBOARD -->
<div id="content">
    <div class="card">

        <img src="Tak berjudul62_20260504070612.png" class="logo">

        <h2>RUNNING EA</h2>

        <div class="status" id="statusText">Status: OFF</div>

        <button class="btn on" onclick="turnOn()">ON</button>
        <button class="btn off" onclick="turnOff()">OFF</button>

        <br>
        <button class="home">Home Screen</button>

        <div class="footer">Hosting to Computer</div>

    </div>
</div>

<script>
window.onload = () => {
    setTimeout(() => {
        loading.style.display = "none";
        content.style.display = "block";
    }, 3000);
};

function turnOn() {
    document.getElementById("statusText").innerText = "Status: ON";
    document.getElementById("soundOn").play();
}

function turnOff() {
    document.getElementById("statusText").innerText = "Status: OFF";
    document.getElementById("soundOff").play();
}
</script>

</body>
</html>
